# Local development & CI services for ReBuild AI.
#   docker compose up -d postgres redis
#   docker compose run --rm app php artisan migrate
#   docker compose run --rm app php artisan test
name: rebuild-ai

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: rebuild
      POSTGRES_USER: rebuild
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rebuild-local-only}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/postgres/20-create-testing-database.sql:/docker-entrypoint-initdb.d/20-create-testing-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebuild -d rebuild"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Shared base for the PHP image. `docker compose run --rm app <cmd>` runs any
  # artisan / composer / phpunit command from the project root.
  app: &php
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
    image: rebuild-ai-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: rebuild
      DB_USERNAME: rebuild
      DB_PASSWORD: ${DB_PASSWORD:-rebuild-local-only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: ["php", "artisan", "about"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # HTTP API on http://localhost:${APP_PORT}. Uses PHP's built-in server
  # directly: `artisan serve` does not pass container environment variables
  # (DB_HOST, REDIS_HOST, ...) to its worker processes. Laravel's router
  # script resolves public/ from the working directory.
  api:
    <<: *php
    working_dir: /var/www/html/public
    ports:
      - "${APP_PORT:-8000}:8000"
    command: ["php", "-S", "0.0.0.0:8000", "../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"]

  # Queue workers for the "sync" and "media" queues (config/horizon.php).
  horizon:
    <<: *php
    command: ["php", "artisan", "horizon"]
    profiles: ["workers"]

  # Runs routes/console.php schedules (token pruning, stale-sync recovery).
  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    profiles: ["workers"]

volumes:
  postgres-data:
  redis-data:
